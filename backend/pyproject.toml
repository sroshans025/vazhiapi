[project]
name = "vazhiapi-backend"
version = "2.0.0"
description = "VazhiAPI — Tamil Nadu financial wellness API (FastAPI)"
requires-python = ">=3.12"
# Runtime dependencies — keep in sync with requirements.txt
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "numpy>=1.26",
    "vaderSentiment>=3.3.2",
    "anthropic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.vercel]
# Vercel serves the FastAPI instance `app` from api/main.py
entrypoint = "api.main:app"

[tool.uv]
# This is an application, not an installable package
package = false
