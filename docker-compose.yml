services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vazhiapi
      POSTGRES_PASSWORD: vazhiapi_secret
      POSTGRES_DB: vazhiapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vazhiapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # postgresql:// is rewritten to postgresql+asyncpg:// by core/config.py
      DATABASE_URL: postgresql://vazhiapi:vazhiapi_secret@postgres:5432/vazhiapi
      SECRET_KEY: ${SECRET_KEY:-local-docker-secret-change-me-please-32chars}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
